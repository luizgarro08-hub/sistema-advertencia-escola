<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Termo de Advertência - E. E. Mestra Hercília</title>
    
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#0d6efd">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0f4f8;
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .header-card {
            background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
            border-radius: 2rem 2rem 0 0;
        }

        .logo-header {
            width: 85px;
            height: 85px;
            object-fit: contain;
            border-radius: 50%;
            background-color: #ffffff;
            padding: 3px;
        }

        .form-check-input:checked {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }

        .card-custom {
            border: none;
            border-radius: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .form-control, .form-select {
            border-radius: 0.75rem;
        }

        .btn-logout {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: none;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background-color: rgba(255, 255, 255, 0.35);
            color: #ffffff;
        }
    </style>
</head>
<body class="py-4 px-2">

    <div class="container" style="max-width: 720px;">
        <div class="card card-custom overflow-hidden bg-white">
            
            <div class="header-card p-4 text-white text-center position-relative">
                <a href="/logout" class="btn btn-sm btn-logout rounded-pill px-3 position-absolute top-0 end-0 m-3 d-flex align-items-center gap-1 shadow-sm">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Sair</span>
                </a>

                <div class="d-flex justify-content-center align-items-center mb-3">
                    <img src="{{ url_for('static', filename='logo.png') }}" 
                         alt="E. E. Mestra Hercília" 
                         class="logo-header shadow"
                         onerror="this.style.display='none'; document.getElementById('svg-logo-prof').style.display='block';">
                    
                    <svg id="svg-logo-prof" width="85" height="85" viewBox="0 0 300 300" style="display: none;" class="shadow rounded-circle bg-white p-1">
                        <defs>
                            <path id="curveTopProf" d="M 35,150 A 115,115 0 1,1 265,150" />
                            <path id="curveBottomProf" d="M 60,205 A 105,105 0 0,0 240,205" />
                        </defs>
                        <circle cx="150" cy="150" r="145" fill="#00BFFF" stroke="#FFFFFF" stroke-width="6"/>
                        <circle cx="150" cy="100" r="35" fill="#FFD700"/>
                        <path d="M 115 105 L 150 45 L 185 105 Z" fill="#FF8C00"/>
                        <path d="M 85 175 C 110 120, 140 100, 148 70 C 150 110, 175 130, 215 175 Z" fill="#FFFFFF"/>
                        <path d="M 125 175 C 135 130, 150 115, 152 85 C 153 115, 170 135, 195 175 Z" fill="#FFFFFF"/>
                        <path d="M 70 180 Q 150 165 230 180 L 210 200 Q 150 195 90 200 Z" fill="#1E56A0" stroke="#FFFFFF" stroke-width="2"/>
                        <text x="150" y="191" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TUDO PELO SABER</text>
                        <path d="M 60 215 Q 90 205 120 215 T 180 215 T 240 215" stroke="#FFFFFF" stroke-width="5" fill="none"/>
                        <path d="M 65 228 Q 95 218 125 228 T 185 228 T 235 228" stroke="#FFFFFF" stroke-width="4" fill="none"/>
                        <path d="M 60 250 Q 150 280 240 250 L 230 235 Q 150 260 70 235 Z" fill="#2070C4" stroke="#FFFFFF" stroke-width="2"/>
                        <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">
                            <textPath href="#curveBottomProf" startOffset="50%" text-anchor="middle">SÃO FRANCISCO - MG</textPath>
                        </text>
                        <text font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="2">
                            <textPath href="#curveTopProf" startOffset="50%" text-anchor="middle">E. E. MESTRA HERCÍLIA</textPath>
                        </text>
                    </svg>
                </div>

                <h5 class="fw-bold text-uppercase mb-1 tracking-wider">Escola Estadual Mestra Hercília</h5>
                <p class="text-white-50 small mb-2">Secretaria de Estado de Educação de Minas Gerais</p>
                <span class="badge bg-white text-primary fw-bold fs-6 px-4 py-2 rounded-pill shadow-sm">TERMO DE ADVERTÊNCIA</span>
            </div>

            <div class="p-4 p-md-5">
                <form method="POST" action="/gerar_advertencia" class="text-start">
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                            <label class="form-label fw-bold text-secondary small">ESTUDANTE</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" name="estudante" class="form-control bg-light border-0 py-2" placeholder="Nome completo do estudante" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary small">TURMA</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-people text-muted"></i></span>
                                <input type="text" name="turma" class="form-control bg-light border-0 py-2" placeholder="Ex: 1º Ano A" required>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4 text-secondary opacity-25">

                    <label class="form-label fw-bold text-dark mb-3">Foi advertido(a) pela(s) falta(s) mencionada(s) abaixo:</label>
                    
                    <div class="card p-3 border-0 bg-light rounded-4 mb-4">
                        
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="motivo" value="Uso indebido do celular." id="m1">
                            <label class="form-check-label" for="m1">Uso indevido do celular.</label>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="motivo" value="Discussão e/ou agressão ao(s) colega(s) em sala de aula ou nas dependências da escola." id="m2">
                            <label class="form-check-label" for="m2">Discussão e/ou agressão ao(s) colega(s) em sala de aula ou nas dependências da escola.</label>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="motivo" value="Danos causados ao patrimônio da escola e/ou materiais de colegas de turma." id="m3">
                            <label class="form-check-label" for="m3">Danos causados ao patrimônio da escola e/ou materiais de colegas de turma.</label>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="motivo" value="Desrespeito aos professores/demais servidores da escola." id="m4">
                            <label class="form-check-label" for="m4">Desrespeito aos professores/demais servidores da escola.</label>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="motivo" value="Ausência de pontualidade no horário de entrada na escola e/ou na sala de aula." id="m5">
                            <label class="form-check-label" for="m5">Ausência de pontualidade no horário de entrada na escola e/ou na sala de aula.</label>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="motivo" value="Infrequência as aulas." id="m6">
                            <label class="form-check-label" for="m6">Infrequência as aulas.</label>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="motivo" value="Não cumprimento das atividades diárias proposta pelo professor (a)." id="m7">
                            <label class="form-check-label" for="m7">Não cumprimento das atividades diárias proposta pelo professor (a).</label>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="motivo" value="Não cumprimento das atividades em progressão parcial." id="m8">
                            <label class="form-check-label" for="m8">Não cumprimento das atividades em progressão parcial.</label>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="motivo" value="Uso do celular e/ou outro aparelho eletroeletrônico na escola e/ou em sala de aula sem permissão. (Lei nº 15.100/2025)." id="m9">
                            <label class="form-check-label" for="m9">
                                Uso do celular e/ou outro aparelho eletroeletrônico na escola e/ou em sala de aula sem permissão. 
                                <small class="d-block text-muted fst-italic mt-1">(Lei nº 15.100/2025, que restringe o uso de aparelhos eletrônicos portáteis pessoais por estudantes durante a aula, o recreio ou intervalos entre as aulas em todas as etapas da educação básica).</small>
                            </label>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="motivo" value="Sair da sala de aula sem permissão do professor (a)." id="m10">
                            <label class="form-check-label" for="m10">Sair da sala de aula sem permissão do professor (a).</label>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="motivo" value="Sair da escola antes do horário sem autorização previa do setor pedagógico/gestão." id="m11">
                            <label class="form-check-label" for="m11">Sair da escola antes do horário sem autorização previa do setor pedagógico/gestão.</label>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="motivo" value="Namoro dentro das instalações da escola." id="m12">
                            <label class="form-check-label" for="m12">Namoro dentro das instalações da escola.</label>
                        </div>

                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="motivo" value="Outros:" id="m13" onchange="document.getElementById('campoOutros').style.display = this.checked ? 'block' : 'none';">
                            <label class="form-check-label fw-bold text-primary" for="m13">Outros:</label>
                        </div>

                        <div class="mt-2 ms-4" id="campoOutros" style="display: none;">
                            <input type="text" name="motivo_outro" class="form-control bg-white border shadow-sm" placeholder="Especifique o motivo da advertência...">
                        </div>

                    </div>

                    <div class="alert alert-warning border-0 rounded-4 small mb-4">
                        <i class="bi bi-info-circle-fill me-1"></i>
                        <strong>Observação:</strong> O(a) estudante foi advertido(a) e orientado(a) pelo seu ato. Em caso de reincidência (3 advertências), os responsáveis serão notificados imediatamente.
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary small">COMPONENTE CURRICULAR</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-journal-bookmark text-muted"></i></span>
                                <input type="text" name="disciplina" class="form-control bg-light border-0 py-2" placeholder="Ex: Matemática, Português" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary small">DATA DA OCORRÊNCIA</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-calendar-event text-muted"></i></span>
                                <input type="date" name="data_ocorrencia" class="form-control bg-light border-0 py-2" required>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-4 shadow-sm py-3">
                        <i class="bi bi-file-earmark-check me-2"></i>Gerar Advertência
                    </button>
                </form>
            </div>
        </div>
    </div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('Service Worker registrado na raiz!', reg))
      .catch(err => console.error('Erro no SW:', err));
  }
</script>
</script>
    
</body>
</html>
