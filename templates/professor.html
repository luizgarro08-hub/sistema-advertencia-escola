<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .btn-check:checked + .btn-outline-success { background-color: #198754; color: white; }
        .btn-check:checked + .btn-outline-warning { background-color: #ffc107; color: black; }
        .btn-check:checked + .btn-outline-danger { background-color: #dc3545; color: white; }
        .motivo-chip { cursor: pointer; transition: all 0.2s; }
        .motivo-chip:hover { background-color: #e9ecef; }
    </style>
</head>
<body class="bg-light pb-5">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold d-flex align-items-center">
                <i class="bi bi-person-badge-fill me-2 fs-4"></i> Área do Professor
            </span>
            <a href="/logout" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="bi bi-box-arrow-right me-1"></i> Sair
            </a>
        </div>
    </nav>

    <div class="container" style="max-width: 700px;">

        {% if sucesso %}
            <div class="alert alert-success alert-dismissible fade show rounded-4 border-0 shadow-sm p-3 mb-4 d-flex align-items-center" role="alert">
                <i class="bi bi-check-circle-fill text-success fs-3 me-3"></i>
                <div>
                    <strong class="d-block">Advertência enviada!</strong>
                    O registro já está disponível no painel da secretaria.
                </div>
                <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
            </div>
        {% endif %}

        <div class="card border-0 shadow-lg rounded-4 p-4 bg-white">
            
            <div class="mb-4">
                <h4 class="fw-bold text-dark mb-1">Registrar Ocorrência Disciplinar</h4>
                <p class="text-muted small">Preencha os campos abaixo para notificar a coordenação.</p>
            </div>

            <form method="POST">
                
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary text-uppercase">Professor Responsável</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-person-fill text-muted"></i></span>
                        <input type="text" name="professor" class="form-control bg-light border-0 py-2" placeholder="Ex: Prof. Carlos Silva" required>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-8">
                        <label class="form-label small fw-bold text-secondary text-uppercase">Nome Completo do Aluno</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-backpack-fill text-muted"></i></span>
                            <input type="text" name="aluno" class="form-control bg-light border-0 py-2" placeholder="Nome do aluno" required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-secondary text-uppercase">Turma</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-people-fill text-muted"></i></span>
                            <input type="text" name="turma" class="form-control bg-light border-0 py-2" placeholder="Ex: 9º Ano A" required>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary text-uppercase d-block mb-2">Nível de Gravidade</label>
                    <div class="btn-group w-100" role="group">
                        
                        <input type="radio" class="btn-check" name="gravidade" id="gravidade_leve" value="Leve" autocomplete="off">
                        <label class="btn btn-outline-success py-2 fw-bold" for="gravidade_leve">
                            <i class="bi bi-info-circle me-1"></i> Leve
                        </label>

                        <input type="radio" class="btn-check" name="gravidade" id="gravidade_media" value="Média" autocomplete="off" checked>
                        <label class="btn btn-outline-warning py-2 fw-bold" for="gravidade_media">
                            <i class="bi bi-exclamation-circle me-1"></i> Média
                        </label>

                        <input type="radio" class="btn-check" name="gravidade" id="gravidade_grave" value="Grave" autocomplete="off">
                        <label class="btn btn-outline-danger py-2 fw-bold" for="gravidade_grave">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i> Grave
                        </label>

                    </div>
                </div>

                <div class="mb-2">
                    <label class="form-label small fw-bold text-secondary text-uppercase d-block mb-1">Atalhos de Motivo Rápidos</label>
                    <div class="d-flex flex-wrap gap-2 mb-2">
                        <span class="badge bg-light text-dark border p-2 motivo-chip" onclick="adicionarMotivo('Uso indevido do celular durante a aula.')">+ Uso de Celular</span>
                        <span class="badge bg-light text-dark border p-2 motivo-chip" onclick="adicionarMotivo('Conversa excessiva atrapalhando a explicação.')">+ Conversa Paralela</span>
                        <span class="badge bg-light text-dark border p-2 motivo-chip" onclick="adicionarMotivo('Desrespeito ou desacato ao professor/colega.')">+ Desrespeito</span>
                        <span class="badge bg-light text-dark border p-2 motivo-chip" onclick="adicionarMotivo('Não realizou/entregou as atividades propostas.')">+ Tarefa Não Feita</span>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary text-uppercase">Descrição Detalhada do Motivo</label>
                    <textarea id="motivo" name="motivo" class="form-control bg-light border-0 p-3" rows="4" placeholder="Descreva o que ocorreu..." required></textarea>
                </div>

                <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold rounded-3 shadow-sm py-3">
                    <i class="bi bi-send-fill me-2"></i> Enviar Advertência
                </button>

            </form>
        </div>
    </div>

    <script>
        function adicionarMotivo(texto) {
            var campo = document.getElementById('motivo');
            if (campo.value !== "") {
                campo.value += " " + texto;
            } else {
                campo.value = texto;
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
