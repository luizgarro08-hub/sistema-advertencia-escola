<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Advertência online - Login</title>
    
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#0d6efd">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
      }
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #0d6efd;
            min-height: 100vh;
            transition: background 0.3s ease;
        }

        [data-bs-theme="dark"] body {
            background: linear-gradient(135deg, #121212 0%, #1e1e1e 100%);
        }

        .btn-theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .logo-escola {
            width: 130px;
            height: 130px;
            object-fit: contain;
            border-radius: 50%;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

    <button id="btnDarkMode" class="btn btn-sm btn-light bg-opacity-25 text-white border-0 rounded-circle p-2 btn-theme-toggle shadow-sm" title="Alternar tema">
        <i class="bi bi-moon-stars-fill fs-5" id="darkModeIcon"></i>
    </button>

    <div class="card shadow-lg border-0 rounded-5 p-3 w-100 bg-body-tertiary" style="max-width: 380px;">
        <div class="card-body text-center">
            
            <div class="mb-3 d-flex justify-content-center">
                <img src="{{ url_for('static', filename='logo.png') }}" 
                     alt="E. E. Mestra Hercília" 
                     class="logo-escola shadow-sm"
                     onerror="this.style.display='none'; document.getElementById('svg-logo-completa').style.display='block';">
                
                <svg id="svg-logo-completa" width="130" height="130" viewBox="0 0 300 300" style="display: none;" class="shadow-sm rounded-circle">
                    <defs>
                        <path id="curveTop" d="M 35,150 A 115,115 0 1,1 265,150" />
                        <path id="curveBottom" d="M 60,205 A 105,105 0 0,0 240,205" />
                    </defs>

                    <circle cx="150" cy="150" r="145" fill="#00BFFF" stroke="#FFFFFF" stroke-width="6"/>

                    <circle cx="150" cy="100" r="35" fill="#FFD700"/>
                    <path d="M 115 105 L 150 45 L 185 105 Z" fill="#FF8C00"/>

                    <path d="M 85 175 C 110 120, 140 100, 148 70 C 150 110, 175 130, 215 175 Z" fill="#FFFFFF"/>
                    <path d="M 125 175 C 135 130, 150 115, 152 85 C 153 115, 170 135, 195 175 Z" fill="#FFFFFF"/>

                    <path d="M 70 180 Q 150 165 230 180 L 210 200 Q 150 195 90 200 Z" fill="#1E56A0" stroke="#FFFFFF" stroke-width="2"/>
                    <text x="150" y="191" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TUDO PELO SABER</text>

                    <path d="M 60 215 Q 90 205 120 215 T 180 215 T 240 215" stroke="#FFFFFF" stroke-width="5" fill="none"/>
                    <path d="M 65 228 Q 95 218 125 228 T 185 228 T 235 228" stroke="#FFFFFF" stroke-width="4" fill="none"/>

                    <path d="M 60 250 Q 150 280 240 250 L 230 235 Q 150 260 70 235 Z" fill="#2070C4" stroke="#FFFFFF" stroke-width="2"/>
                    <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">
                        <textPath href="#curveBottom" startOffset="50%" text-anchor="middle">
                            SÃO FRANCISCO - MG
                        </textPath>
                    </text>

                    <text font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="2">
                        <textPath href="#curveTop" startOffset="50%" text-anchor="middle">
                            E. E. MESTRA HERCÍLIA
                        </textPath>
                    </text>
                </svg>
            </div>

            <h4 class="fw-bold mb-1">Advertência online</h4>
            <p class="text-secondary small mb-4">Entre com suas credenciais</p>

            <form method="POST" class="text-start">
                
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">USUÁRIO</label>
                    <div class="input-group">
                        <span class="input-group-text bg-body-secondary border-0"><i class="bi bi-person text-secondary"></i></span>
                        <input type="text" name="usuario" 
                               class="form-control bg-body-secondary border-0 py-2 {% if erro_usuario %}is-invalid{% endif %}" 
                               placeholder="Digite seu usuário" required>
                    </div>
                    {% if erro_usuario %}
                        <div class="text-danger small mt-1 ps-1 fw-semibold">
                            <i class="bi bi-exclamation-circle-fill me-1"></i>{{ erro_usuario }}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary">SENHA</label>
                    <div class="input-group">
                        <span class="input-group-text bg-body-secondary border-0"><i class="bi bi-key text-secondary"></i></span>
                        <input type="password" name="senha" 
                               class="form-control bg-body-secondary border-0 py-2 {% if erro_senha %}is-invalid{% endif %}" 
                               placeholder="Digite a senha" required>
                    </div>
                    {% if erro_senha %}
                        <div class="text-danger small mt-1 ps-1 fw-semibold">
                            <i class="bi bi-exclamation-circle-fill me-1"></i>{{ erro_senha }}
                        </div>
                    {% endif %}
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-4 shadow-sm py-2">
                    Entrar <i class="bi bi-arrow-right-short"></i>

                </button>
            </form>
        </div>
    </div>

  
</body>
</html>
