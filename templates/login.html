<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Escola</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-primary bg-gradient d-flex align-items-center justify-content-center vh-100 p-3">

    <div class="card shadow-lg border-0 rounded-5 p-3 w-100" style="max-width: 380px;">
        <div class="card-body text-center">
            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-3">
                <i class="bi bi-shield-lock-fill fs-1"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Acesso Escolar</h4>
            <p class="text-muted small mb-4">Entre com suas credenciais</p>

            <form method="POST" class="text-start">
                
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">USUÁRIO</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" name="usuario" 
                               class="form-control bg-light border-0 py-2 {% if erro_usuario %}is-invalid{% endif %}" 
                               placeholder="Digite seu usuário" required>
                    </div>
                    {% if erro_usuario %}
                        <div class="text-danger small mt-1 ps-1 fw-semibold">
                            <i class="bi bi-exclamation-circle-fill me-1"></i>{{ erro_usuario }}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary">SENHA</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-key text-muted"></i></span>
                        <input type="password" name="senha" 
                               class="form-control bg-light border-0 py-2 {% if erro_senha %}is-invalid{% endif %}" 
                               placeholder="Digite a senha" required>
                    </div>
                    {% if erro_senha %}
                        <div class="text-danger small mt-1 ps-1 fw-semibold">
                            <i class="bi bi-exclamation-circle-fill me-1"></i>{{ erro_senha }}
                        </div>
                    {% endif %}
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-4 shadow-sm py-2">
                    Entrar <i class="bi bi-arrow-right-short"></i>
                </button>
            </form>
        </div>
    </div>

</body>
</html>
