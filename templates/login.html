<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Escola</title>
    
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#0d6efd">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
      }
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            min-height: 100vh;
            transition: background 0.3s ease;
        }

        [data-bs-theme="dark"] body {
            background: linear-gradient(135deg, #121212 0%, #1e1e1e 100%);
        }

        .btn-theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

    <button id="btnDarkMode" class="btn btn-sm btn-light bg-opacity-25 text-white border-0 rounded-circle p-2 btn-theme-toggle shadow-sm">
        <i class="bi bi-moon-stars-fill fs-5" id="darkModeIcon"></i>
    </button>

    <div class="card shadow-lg border-0 rounded-5 p-3 w-100 bg-body-tertiary" style="max-width: 380px;">
        <div class="card-body text-center">
            <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-3">
                <i class="bi bi-shield-lock-fill fs-1"></i>
            </div>
            <h4 class="fw-bold mb-1">Acesso Escolar</h4>
            <p class="text-secondary small mb-4">Entre com suas credenciais</p>

            <form method="POST" class="text-start">
                
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">USUÁRIO</label>
                    <div class="input-group">
                        <span class="input-group-text bg-body-secondary border-0"><i class="bi bi-person text-secondary"></i></span>
                        <input type="text" name="usuario" 
                               class="form-control bg-body-secondary border-0 py-2 {% if erro_usuario %}is-invalid{% endif %}" 
                               placeholder="Digite seu usuário" required>
                    </div>
                    {% if erro_usuario %}
                        <div class="text-danger small mt-1 ps-1 fw-semibold">
                            <i class="bi bi-exclamation-circle-fill me-1"></i>{{ erro_usuario }}
                        </div>
                    {% endif %}
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary">SENHA</label>
                    <div class="input-group">
                        <span class="input-group-text bg-body-secondary border-0"><i class="bi bi-key text-secondary"></i></span>
                        <input type="password" name="senha" 
                               class="form-control bg-body-secondary border-0 py-2 {% if erro_senha %}is-invalid{% endif %}" 
                               placeholder="Digite a senha" required>
                    </div>
                    {% if erro_senha %}
                        <div class="text-danger small mt-1 ps-1 fw-semibold">
                            <i class="bi bi-exclamation-circle-fill me-1"></i>{{ erro_senha }}
                        </div>
                    {% endif %}
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-4 shadow-sm py-2">
                    Entrar <i class="bi bi-arrow-right-short"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
      const btnDarkMode = document.getElementById('btnDarkMode');
      const darkModeIcon = document.getElementById('darkModeIcon');
      const htmlElement = document.documentElement;

      function aplicarTema(tema) {
        htmlElement.setAttribute('data-bs-theme', tema);
        if (tema === 'dark') {
          darkModeIcon.classList.replace('bi-moon-stars-fill', 'bi-sun-fill');
        } else {
          darkModeIcon.classList.replace('bi-sun-fill', 'bi-moon-stars-fill');
        }
        localStorage.setItem('theme', tema);
      }

      const temaSalvo = localStorage.getItem('theme') || 'light';
      aplicarTema(temaSalvo);

      btnDarkMode.addEventListener('click', () => {
        const temaAtual = htmlElement.getAttribute('data-bs-theme');
        const novoTema = temaAtual === 'dark' ? 'light' : 'dark';
        aplicarTema(novoTema);
      });
    </script>
</body>
</html>
